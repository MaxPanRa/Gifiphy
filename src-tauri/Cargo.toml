[package]
name = "gifiphy"
version = "0.1.0"
description = "Conversor de video a GIF animado con compresion dirigida a un limite de tamano"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gifiphy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
